# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: en

# Change to your timezone
timezone: America/Denver

# jekyll-seo-tag settings

title: Taylor Firman

tagline: Data Scientist, Biophysics PhD

description: >-
  Personal website and blog of Taylor Firman - data science, statistics, baseball analytics, and more.

# Fill in the protocol & hostname for your site.
url: "https://taylorfirman.com"

github:
  username: tefirman

twitter:
  username: tefirman51

social:
  name: Taylor Firman
  email: tefirman@gmail.com
  links:
    - https://twitter.com/tefirman51
    - https://github.com/tefirman

# Web Analytics Settings
analytics:
  google:
    id: # Add your GA4 ID here if you want analytics

# Prefer color scheme setting (light, dark, or empty for system default)
theme_mode:

# the avatar on sidebar, support local or CORS resources
avatar: /assets/img/avatar.jpg

# boolean type, the global switch for TOC in posts.
toc: true

# Comments - disabled as requested
comments:
  provider:

pwa:
  enabled: true
  cache:
    enabled: true

paginate: 10

# The base URL of your site
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
  math_engine: mathjax

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
